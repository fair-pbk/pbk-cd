id: cui_validation
label: cui_validation
model_instances:
  - id: pbk_cd_gastellu_2026_revised
    label: Gastellu (2026)
    model_path: ./model/pbk_cd_gastellu_2026_revised.sbml
    param_file: './model/pbk_cd_gastellu_2026_revised.params.csv'
    target_mappings:
      VBlood: 'vb'
      BW: 'wbw'
      AGut: 'GUT_LUMEN'
      APlasma: 'PLASMA'
      ARBC: 'RBC'
      AMetallothionein: 'META'
      CPlasma: '[PLASMA]'
      CBlood: '(RBC + k20 * (PLASMA + META)) / vb'
      ALiver: 'LIVER'
      CLiver: '[LIVER]'
      AKidney: 'KIDNEY'
      CKidney: '[KIDNEY]'
      UrineCR: '(k_MT_out * k17b * META + k19x * KIDNEY) / ucr'
      AUrine: 'URINE'
      AFeces: 'FECES'
  - id: pbk_cd_cui_2026
    label: Cui (2026)
    model_path: ./model/pbk_cd_cui_2026/pbk_cd_cui_2026.sbml
    param_file: ./model/pbk_cd_cui_2026/pbk_cd_cui_2026.params.csv
    target_mappings:
      AGut: 'AGILumen'
      ALiver: 'ALiverT_Free'
      APlasma: 'ARBB_PP'
      CPlasma: '[ARBB_PP]'
      CLiver: '[ALiverT_Free]'
      CKidney: '[AKidneyT_Free]'
      Age: 'year'
      BW: 'BWl'

scenarios:
  - id: oral_repeated
    label: Oral repeated dosing (1 ug/day)
    time_unit: DAY
    amount_unit: MICROGRAMS
    duration: 10000
    evaluation_resolution: 1
    use_distributions: True
    n_simulations: 10
    parameters:
        Age: 0
    dosing_events:
      - type: repeated_bolus
        target: AGut
        amount: 1.0
        time: 0
        interval: 1
    outputs:
      - id: Age
        label: Age
        output: Age
      - id: BW
        label: BW
        output: BW
      - id: AGut
        label: AGut
        output: AGut
      - id: APlasma
        label: APlasma
        output: APlasma
      - id: CPlasma
        label: CPlasma
        output: CPlasma
      - id: ALiver
        label: ALiver
        output: ALiver
      - id: CLiver
        label: CLiver
        output: CLiver

