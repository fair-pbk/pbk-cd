id: lifetime_comparison
label: lifetime_comparison
model_instances:
  - id: Cd_non_lifetime_low
    label: Cd_non_lifetime_low
    model_path: ./models/Cd_non_lifetime/Cd_non_lifetime.sbml
    param_file: ./models/Cd_non_lifetime/Cd_non_lifetime_low.params.csv
    target_mappings:
      CPlasma: '[APlasma]'
      CLiver: '[ALiver]'
      CKidney: '[AKidney]'
  - id: Cd_non_lifetime_high
    label: Cd_non_lifetime_high
    model_path: ./models/Cd_non_lifetime/Cd_non_lifetime.sbml
    param_file: ./models/Cd_non_lifetime/Cd_non_lifetime_high.params.csv
    target_mappings:
      CPlasma: '[APlasma]'
      CLiver: '[ALiver]'
      CKidney: '[AKidney]'
  - id: Cd_lifetime_BW_Gastellu
    label: Cd_lifetime_BW_Gastellu
    model_path: ./models/Cd_lifetime_BW_Gastellu/Cd_lifetime_BW_Gastellu.sbml
    param_file: ./models/Cd_lifetime_BW_Gastellu/Cd_lifetime_BW_Gastellu.params.csv
    target_mappings:
      CPlasma: '[APlasma]'
      CLiver: '[ALiver]'
      CKidney: '[AKidney]'
  - id: Cd_lifetime_Gastellu
    label: Cd_lifetime_Gastellu
    model_path: ./models/Cd_lifetime_Gastellu/Cd_lifetime_Gastellu.sbml
    param_file: ./models/Cd_lifetime_Gastellu/Cd_lifetime_Gastellu.params.csv
    target_mappings:
      CPlasma: '[APlasma]'
      CLiver: '[ALiver]'
      CKidney: '[AKidney]'
  - id: Cd_Cui_2026
    label: Cd_Cui_2026
    model_path: ./models/Cd_Cui_2026/Cd_Cui_2026.sbml
    param_file: ./models/Cd_Cui_2026/Cd_Cui_2026.params.csv
    target_mappings:
      AGut: 'AGILumen'
      ALiver: 'ALiverT_Free'
      CPlasma: '[ARBT_Free]'
      CLiver: '[ALiverT_Free]'
      CKidney: '[AKidneyT_Free]'
      Age: 'year'
      BW: 'BWl'

scenarios:
  - id: oral_repeated
    label: Oral repeated dosing (1 ug/day)
    time_unit: DAY
    amount_unit: MICROGRAMS
    duration: 10000
    evaluation_resolution: 1
    use_distributions: True
    n_simulations: 10
    parameters:
        Age: 0
    dosing_events:
      - type: repeated_bolus
        target: AGut
        amount: 1.0
        time: 0
        interval: 1
    outputs:
      - id: Age
        label: Age
        output: Age
      - id: BW
        label: BW
        output: BW
      - id: AGut
        label: AGut
        output: AGut
      - id: ALiver
        label: ALiver
        output: ALiver
      - id: CLiver
        label: CLiver
        output: CLiver

