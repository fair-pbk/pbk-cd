id: leconte_2021
label: Leconte 2021
model_instances:
- id: PBK_Cd
  label: SBML
  model_path: ./model/pbk_cd_gastellu_2026_revised.sbml
  param_file: ./model/pbk_cd_gastellu_2026_revised.params.csv
  target_mappings:
    VBlood: vb
    BW: wbw
    AGut: GUT_LUMEN
    CKidney: KIDNEY / vk / 1000
    UrineCR: (k_MT_out * k17b * META + k19x * KIDNEY) / ucr
scenarios:
- id: leconte_2021_0p5
  label: Leconte 2021 - 0.5 ug/kg BW/day
  time_unit: DAY
  amount_unit: MICROGRAMS
  duration: 22995
  evaluation_resolution: 1
  dosing_events:
  - type: repeated_bolus
    target: AGut
    amount: 0.5
    time: 0
    interval: 1
    adjustment: BW
  parameters:
    Age: 0
    sex: 1
    AgeRef: 30
    BWRef: 85
  outputs:
  - id: UrineCR
    label: Creatinine adjusted urine
    output: UrineCR
  reference_data:
  - id: leconte_2021
    label: Leconte 2021
    file_path: validation/reference_data/processed/leconte_2021_0p5.csv
    series_type: CHECKPOINTS
    time_unit: DAY
    mappings:
      UrineCR: UrineCR
- id: leconte_2021_1p0
  label: Leconte 2021 - 1.0 ug/kg BW/day
  time_unit: DAY
  amount_unit: MICROGRAMS
  duration: 22995
  evaluation_resolution: 1
  dosing_events:
  - type: repeated_bolus
    target: AGut
    amount: 1.0
    time: 0
    interval: 1
    adjustment: BW
  parameters:
    Age: 0
    sex: 1
    AgeRef: 30
    BWRef: 85
  outputs:
  - id: UrineCR
    label: Creatinine adjusted urine
    output: UrineCR
  reference_data:
  - id: leconte_2021
    label: Leconte 2021
    file_path: validation/reference_data/processed/leconte_2021_1p0.csv
    series_type: CHECKPOINTS
    time_unit: DAY
    mappings:
      UrineCR: UrineCR
